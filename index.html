<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scanner Diksuspala</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#182230;font-family:Arial,sans-serif}.wrap{max-width:640px;margin:auto;padding:15px}.card{background:white;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 12px #0000000b}h1{font-size:22px;margin:0 0 5px}.muted{font-size:13px;color:#667085}label{display:block;font-weight:bold;margin:13px 0 6px}input,select,button{width:100%;padding:13px;border-radius:10px;font-size:16px}input,select{border:1px solid #cbd5e1;background:white}button{border:0;background:#145da0;color:white;font-weight:bold;margin-top:10px}button.alt{background:#475467}.stats{display:flex;gap:8px}.stat{flex:1;padding:12px;background:#f1f5f9;border-radius:12px}.num{font-size:25px;font-weight:800}#reader{max-width:460px;margin:10px auto}.result{display:none;padding:13px;border-radius:12px;margin-top:12px}.ok{display:block;background:#dcfce7;color:#166534}.warn{display:block;background:#fef3c7;color:#92400e}.err{display:block;background:#fee2e2;color:#991b1b}.name{font-size:18px;font-weight:800;margin:5px 0}.small{font-size:12px;color:#667085;margin-top:10px}
</style></head><body><div class="wrap">
<div class="card"><h1>Absensi Diksuspala TPAmu</h1><div class="muted">Scanner QR Code peserta — HP panitia</div>
<label>URL Web App Google Apps Script</label><input id="endpoint" type="url" placeholder="https://script.google.com/macros/s/.../exec">
<label>Petugas / kode HP</label><input id="operator" value="Meja 1">
<label>Sesi absensi</label><select id="session" onchange="refreshStats()"><option>Hari 1 - Datang</option><option>Hari 1 - Pulang</option><option>Hari 2 - Datang</option><option>Hari 2 - Pulang</option></select>
<button class="alt" onclick="saveSettings()">Simpan pengaturan di HP ini</button></div>
<div class="card"><div class="stats"><div class="stat"><div class="muted">Peserta</div><div class="num" id="total">-</div></div><div class="stat"><div class="muted">Sudah scan</div><div class="num" id="hadir">-</div></div><div class="stat"><div class="muted">Belum scan</div><div class="num" id="belum">-</div></div></div></div>
<div class="card"><h2 style="font-size:18px;margin:0">Pemindai QR Code</h2><div id="reader"></div><button id="start" onclick="startScanner()">Mulai / Aktifkan Kamera</button><button class="alt" onclick="stopScanner()">Hentikan Kamera</button><div id="result" class="result"></div><div class="small">Buka halaman ini langsung di Chrome Android melalui HTTPS. Izinkan kamera saat diminta. Gunakan kamera belakang.</div></div>
</div><script>
let scanner=null,busy=false,lastText='',lastTime=0,pending={};const $=id=>document.getElementById(id);
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function show(type,title,detail){let e=$('result');e.className='result '+type;e.innerHTML='<strong>'+esc(title)+'</strong><div class="name">'+esc(detail||'')+'</div>';}
function endpoint(){let u=$('endpoint').value.trim();if(!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(u))throw Error('Masukkan URL Web App Apps Script yang benar dan berakhiran /exec.');return u;}
function saveSettings(){try{endpoint();localStorage.setItem('diksuspala_endpoint',$('endpoint').value.trim());localStorage.setItem('diksuspala_operator',$('operator').value);show('ok','Pengaturan tersimpan','Konfigurasi tersimpan di HP ini.');refreshStats();}catch(e){show('err','Periksa URL',e.message);}}
function jsonp(params,cb){let id='r'+Date.now()+Math.random().toString(36).slice(2);params.reqId=id;pending[id]=cb;let s=document.createElement('script');s.src=endpoint()+'?'+new URLSearchParams(params).toString()+'&_='+Date.now();s.onerror=()=>{delete pending[id];show('err','Koneksi gagal','Periksa internet, URL Apps Script, dan deployment.');};document.body.appendChild(s);setTimeout(()=>{if(pending[id]){delete pending[id];show('err','Server tidak merespons','Periksa koneksi internet.');}},20000);setTimeout(()=>s.remove(),25000);}
function handleServerResult(d){let cb=pending[d.reqId];if(cb){delete pending[d.reqId];cb(d);}}
function refreshStats(){try{jsonp({action:'stats',session:$('session').value},d=>{if(d.ok){$('total').textContent=d.total;$('hadir').textContent=d.hadir;$('belum').textContent=d.belum;}else show('err','Gagal memuat rekap',d.message);});}catch(e){}}
function startScanner(){if(!window.Html5Qrcode){show('err','Scanner tidak termuat','Periksa internet lalu muat ulang halaman.');return;}try{endpoint();}catch(e){show('err','URL belum benar',e.message);return;}if(scanner)return;scanner=new Html5Qrcode('reader');scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:230,height:230},aspectRatio:1},onScan,()=>{}).then(()=>{$('start').textContent='Kamera aktif';refreshStats();}).catch(e=>{scanner=null;show('err','Kamera tidak dapat dibuka',String(e));});}
function stopScanner(){if(!scanner)return;scanner.stop().then(()=>{scanner.clear();scanner=null;$('start').textContent='Mulai / Aktifkan Kamera';}).catch(()=>{scanner=null;});}
function onScan(decoded){let now=Date.now();if(busy||(decoded===lastText&&now-lastTime<3500))return;busy=true;lastText=decoded;lastTime=now;show('warn','Memproses QR Code...','Mohon tunggu');jsonp({action:'scan',token:decoded,session:$('session').value,operator:$('operator').value||'Panitia'},d=>{let p=d.peserta||{},detail=(p.nama||'-')+' — '+(p.asal||'-');if(d.ok){show('ok','BERHASIL',detail);if(navigator.vibrate)navigator.vibrate(120);}else if(d.duplicate){show('warn','SUDAH ABSEN',detail);}else show('err','GAGAL',d.message||'Tidak dapat mencatat absensi.');refreshStats();setTimeout(()=>busy=false,1200);});}
window.addEventListener('load',()=>{$('endpoint').value=localStorage.getItem('diksuspala_endpoint')||'';$('operator').value=localStorage.getItem('diksuspala_operator')||'Meja 1';});
</script></body></html>
